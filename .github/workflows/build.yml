name: Build and release

on:
  push:
    branches: [main, hichiro/ha-config]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and update
        required: true
        default: hichiro/ha-config
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate on demand and after pushes to the Home Assistant config branch.
      - name: Regenerate dash.html
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'hichiro/ha-config')
        run: |
          node build.mjs
          if ! git diff --quiet -- dash.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dash.html
            git commit -m "build: regenerate dash.html"
            git push origin HEAD:${{ github.event.inputs.branch || github.ref_name }}
          fi

      # On same-repository PRs, rebuild the checked-out source before checking it.
      - name: Regenerate dash.html for same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: node build.mjs

      # dash.html in the repo must be exactly what src/ builds to.
      - name: dash.html is up to date
        run: node build.mjs --check

      # Every source script must be valid JavaScript.
      - name: Syntax check
        run: |
          for f in $(find src/js -name '*.js' | sort); do node --check "$f"; done

      # Boot the built file in a real browser.
      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test
        run: node tests/smoke.mjs
      - name: Garage alert test
        run: node tests/garage-alert.mjs
      - name: Landscape / full screen test
        run: node tests/landscape.mjs
      - name: Irrigation test
        run: node tests/irrigation.mjs
      - name: View page full screen test
        run: node tests/view-fullscreen.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dash.html
          path: dash.html

  release:
    # only when you push a version tag, e.g. git tag v1.0.1 && git push --tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the VERSION file
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION | tr -d '[:space:]')" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - run: node build.mjs --check
      - name: Release notes come from CHANGELOG.md
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          awk -v v="$v" '/^## /{ if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dash.html config.example.js \
            --title "Kinetic ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
