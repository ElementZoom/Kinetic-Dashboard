/* --- Liquid Glass (Apple) ---
   Apple's rule: glass is the controls/navigation layer floating over the content. The content layer uses a
   standard, thicker material (here: --gc). Colour goes on glass sparingly: selected items use a lighter
   glass fill with a tinted label, not a coloured background with a glow. */
html[data-style=glass]{--g1:rgba(255,255,255,.10);--g2:rgba(255,255,255,.08);--gline:rgba(255,255,255,.22);--gsh:0 12px 32px rgba(0,0,0,.28);--gb:blur(24px) saturate(170%);--gc:rgba(255,255,255,.085);--gcl:rgba(255,255,255,.13);--gcs:0 6px 20px rgba(0,0,0,.18);--gsel:rgba(255,255,255,.2);--gf:rgba(255,255,255,.08);--gfl:rgba(255,255,255,.22);--gss:none}
html[data-style=glass][data-mode=light]{--g1:rgba(255,255,255,.52);--g2:rgba(255,255,255,.4);--gline:rgba(255,255,255,.85);--gsh:0 10px 28px rgba(60,70,120,.16);--gc:rgba(255,255,255,.84);--gcl:rgba(60,64,90,.12);--gcs:0 6px 20px rgba(60,70,120,.12);--gsel:#fff;--gf:rgba(var(--w),.07);--gfl:rgba(var(--w),.13);--gss:0 1px 3px rgba(40,50,90,.28)}
html[data-style=glass] body{background:radial-gradient(55% 45% at 12% 8%,rgba(var(--mint-rgb),.5),transparent 62%),radial-gradient(50% 45% at 92% 18%,rgba(var(--cool-rgb),.5),transparent 62%),radial-gradient(55% 50% at 72% 100%,rgba(var(--heat-rgb),.38),transparent 62%),linear-gradient(160deg,var(--bg2),var(--bg))}
html[data-style=glass][data-mode=light] body{background:radial-gradient(55% 45% at 12% 8%,rgba(var(--mint-rgb),.4),transparent 62%),radial-gradient(50% 45% at 92% 18%,rgba(var(--cool-rgb),.4),transparent 62%),radial-gradient(55% 50% at 72% 100%,rgba(var(--heat-rgb),.3),transparent 62%),linear-gradient(160deg,var(--bg2),var(--bg))}
/* content layer: standard material, no blur */
html[data-style=glass] :where(.pn,.card,.rc,.cd,.ws,.zf){background:var(--gc);border:1px solid var(--gcl);box-shadow:var(--gcs)}
/* functional layer: Liquid Glass */
html[data-style=glass] :where(header,#mshe,#btab,nav){background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 42%,rgba(255,255,255,.1)),var(--g1);border:1px solid var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),var(--gsh);-webkit-backdrop-filter:var(--gb);backdrop-filter:var(--gb)}
html[data-style=glass] :where(.pn,.card,.cd,.ws,.zf){border-radius:28px}
html[data-style=glass] :where(.rc,.kpb,.spb){border-radius:26px}
html[data-style=glass] :where(header){border-radius:999px}
html[data-style=glass] nav{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),var(--g1);color:var(--ink);border-radius:30px}
html[data-style=glass] nav a{background:var(--gf);color:var(--ink);opacity:1;border:1px solid transparent;border-radius:999px}
html[data-style=glass] nav a.on,html[data-style=glass] nav a:active{background:var(--gsel);color:var(--mint);border-color:var(--gfl);box-shadow:var(--gss),inset 0 1px 0 rgba(255,255,255,.4)}
html[data-style=glass] :where(.tl,.bd,.chip,.eb,.rnd,.fcc>div,.vtv>div,.vch,.sty,.pk,.mshe a,#mshe a){background:var(--gf);border:1px solid var(--gfl);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
html[data-style=glass] :where(.tl,.bd){border-radius:22px}
html[data-style=glass] :where(.chip,.eb,.vch){border-radius:999px}
html[data-style=glass] :where(.rnd){border-radius:50%}
html[data-style=glass] :is(.eb.on,.chip.on,.seg .on){background:var(--gsel);color:var(--ink);border-color:var(--gfl);box-shadow:var(--gss),inset 0 1px 0 rgba(255,255,255,.45)}
html[data-style=glass][data-mode=light]:not(#x) :is(.eb.on,.chip.on,.seg .on){background:linear-gradient(rgba(255,255,255,.96),rgba(255,255,255,.88));border-color:rgba(255,255,255,.95);color:var(--mint);-webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);box-shadow:0 4px 14px rgba(60,70,120,.12),0 1px 3px rgba(60,70,120,.08),inset 0 0 0 1px rgba(255,255,255,.9)}   /* light glass, like iOS: a brighter translucent capsule with a bright rim; only the label carries the accent */
html[data-style=glass] #btab{border-radius:999px;padding:7px}
html[data-style=glass] #btab a,html[data-style=glass] #btab button{border-radius:999px}
html[data-style=glass] :is(#btab a.on,#btab button.on,#mshe a.on){background:var(--gsel);color:var(--mint);box-shadow:var(--gss),inset 0 1px 0 rgba(255,255,255,.5)}
html[data-style=glass] :is(.card.heat,.rc.heat){background:linear-gradient(160deg,rgba(var(--heat-rgb),.4),rgba(var(--heat-rgb),.08)),var(--gc)}
html[data-style=glass] :is(.card.cool,.rc.cool){background:linear-gradient(160deg,rgba(var(--cool-rgb),.4),rgba(var(--cool-rgb),.08)),var(--gc)}
html[data-style=glass] :is(.card.auto,.rc.auto){background:linear-gradient(160deg,rgba(var(--mint-rgb),.38),rgba(var(--mint-rgb),.07)),var(--gc)}
html[data-style=glass] .tl.on{background:rgba(var(--lit-rgb),.28);border-color:rgba(var(--lit-rgb),.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
html[data-style=glass] #np{background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.04)),var(--g1);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
@media(max-width:760px){html[data-style=glass]{--gb:blur(16px) saturate(160%)}}
/* accessibility: as with iOS, drop transparency and raise contrast when the device asks for it */
@media(prefers-reduced-transparency:reduce){html[data-style=glass] :is(header,#mshe,#btab,nav,#np){background:var(--bg2);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(prefers-contrast:more){html[data-style=glass]{--gline:rgba(var(--w),.7);--gfl:rgba(var(--w),.6);--gcl:rgba(var(--w),.6);--gc:var(--bg2);--gsel:rgba(var(--w),.28)}html[data-style=glass] :is(header,#mshe,#btab,nav,#np){background:var(--bg2);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* --- Material 3 (Google) ---
   M3 shows depth with tonal surface roles (surface < container < container-high), each a fixed tone of the
   palette, and a solid secondary-container pill for the selected destination. Interaction uses state layers
   (hover 8%, focus 10%, pressed 10% of the on-surface colour). Fallbacks below keep the old translucent look
   on browsers without color-mix(). */
html[data-style=material]{--m1:rgba(var(--w),.075);--m2:rgba(var(--w),.12);--mp:rgba(var(--mint-rgb),.3)}

html[data-style=material] body{background:var(--bg)}
html[data-style=material] :where(.pn,.card,.rc,header,.kpb,.spb,#cpp .cpsh,#mshe,#btab,.cd,.ws,.zf){background:var(--m1);border:0;box-shadow:none;border-radius:28px}

@supports(color:color-mix(in srgb,red,blue)){

}
